name: skill-checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'skills/computer-use/**'
      - 'scripts/install_smart_defaults.py'
      - 'scripts/test_install_smart_defaults.py'
      - '.github/workflows/skill-checks.yml'
  push:
    branches: [main]
    paths:
      - 'skills/computer-use/**'
      - 'scripts/install_smart_defaults.py'
      - 'scripts/test_install_smart_defaults.py'
      - '.github/workflows/skill-checks.yml'

permissions:
  contents: read

jobs:
  skill-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Isolated installer checks (no host config, desktop, CLI runtime or models)
        run: python -m unittest discover -s scripts -p test_install_smart_defaults.py -v
      - name: Skill frontmatter and progressive reference links
        run: |
          pip install pyyaml
          python - <<'PYCODE'
          from pathlib import Path
          import re, yaml
          root = Path('skills/computer-use')
          text = (root / 'SKILL.md').read_text()
          metadata = yaml.safe_load(text.split('---', 2)[1])
          assert metadata['name'] == 'computer-use'
          assert isinstance(metadata['description'], str) and metadata['description']
          for source in root.rglob('*.md'):
              for target in re.findall(r'\]\(([^)]+)\)', source.read_text()):
                  if not target.startswith(('https:', 'http:', '/')):
                      assert (source.parent / target.split('#')[0]).is_file(), (source, target)
          PYCODE

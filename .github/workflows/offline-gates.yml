name: offline-gates

# Offline only: fakes and fixtures. No secrets, no models or GPUs, no desktop, no network beyond pip.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Runs on the homelab runner fleet (homelab-infra broker) when the repository variable LOCAL_LINUX_CI_ENABLED is 'true'; fork PRs
# always stay on GitHub-hosted runners (same-repository guard), as in unified-hifi-control. The repo must also be in the broker's
# FLEET_GITHUB_REPOSITORIES_JSON allowlist, or a self-hosted job waits with no runner.
concurrency:
  group: offline-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-gates:
    runs-on: ${{ vars.LOCAL_LINUX_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","linux-general"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install facade requirements
        run: pip install -r computer_use/requirements.txt
      - name: Facade unit tests (fail if any is skipped so the mcp-dependent guardrails must run)
        run: |
          set -o pipefail
          python -m unittest discover -s computer_use -p 'test_*.py' 2>&1 | tee facade-tests.log
          if grep -q 'skipped=' facade-tests.log; then echo 'facade tests were skipped; the guardrails did not run' >&2; exit 1; fi
      - name: Dispatcher unit tests
        run: cd inference/cua-decider/capability-dispatch && python -m unittest test_dispatch
      - name: Decider unit tests
        run: python -m unittest discover -s inference/cua-decider -p 'test_*.py'
      - name: Script unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Experiment scorer tests
        run: python -m unittest discover -s experiments/facade-vs-native -p 'test_*.py'
      - name: Simulation gate
        run: python inference/cua-decider/capability-dispatch/simulation_gate.py
      - name: Skill sketch snapshot is current
        run: python scripts/sync_skill_references.py --check
      - name: MCP protocol smoke
        run: python computer_use/check_protocol.py
      - name: Call budget (default path stays within its measured LLM-visible calls)
        run: python scripts/check_call_budget.py
      - name: Plan mutation checks (each wrong patch of look-then-plan must fail its test by assertion)
        run: python scripts/check_plan_mutations.py
      - name: Look comparison (structure and size only; live latency and accuracy are not measured)
        run: python scripts/look_compare.py
